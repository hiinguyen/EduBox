# DEV-ONLY VALUES FOR THE LOCAL DOCKER COMPOSE STACK. NOT SECRETS.
#
# tool/bootstrap.sh copies this file to the git-ignored config/passwords.yaml
# when that file is missing, and never overwrites it. Every value below only
# unlocks containers on your own machine. There is deliberately no staging or
# production section.
#
# The only real secret a developer may add, by hand and only to their own
# config/passwords.yaml, is the optional OpenRouter key (phase 4):
#   development:
#     openRouterApiKey: '<your key>'

development:
  # Compose `postgres` service (POSTGRES_PASSWORD in compose.yaml).
  database: 'dev-only-postgres-password'
  serviceSecret: 'dev-only-service-secret-0000000000'
  emailSecretHashPepper: 'dev-only-email-pepper-00000000000'
  jwtHmacSha512PrivateKey: 'dev-only-jwt-hmac-key-000000000000'
  jwtRefreshTokenHashPepper: 'dev-only-jwt-refresh-pepper-00000'
  # Compose `minio` service root credentials (MINIO_ROOT_USER/PASSWORD).
  storageAccessKey: 'edubox-dev'
  storageSecretKey: 'dev-only-minio-password'
  # Header token for the e2e control route (enabled only in the compose e2e
  # server; see docs/build/phase-1/contract.md).
  e2eControlToken: 'dev-only-e2e-control-token'

test:
  # Compose `postgres_test` service.
  database: 'dev-only-postgres-test-password'
  emailSecretHashPepper: 'test-only-email-pepper-0000000000'
  jwtHmacSha512PrivateKey: 'test-only-jwt-hmac-key-00000000000'
  jwtRefreshTokenHashPepper: 'test-only-jwt-refresh-pepper-0000'
  storageAccessKey: 'edubox-dev'
  storageSecretKey: 'dev-only-minio-password'
  # Header token for the e2e control route in the test run mode.
  e2eControlToken: 'test-only-e2e-control-token'

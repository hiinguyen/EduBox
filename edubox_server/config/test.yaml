# Test run mode: Serverpod test tools (`withServerpod`) against the compose
# `postgres_test` service. Each test group gets an ephemeral database on it;
# ports 0 let test groups run concurrently.

apiServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

insightsServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

database:
  host: localhost
  port: 9090
  name: edubox_test
  user: postgres

redis:
  enabled: false

sessionLogs:
  persistentEnabled: false
  consoleEnabled: false

edubox:
  storage:
    endpoint: http://localhost:9000
    publicEndpoint: http://localhost:9000
    bucket: edubox-test
    region: us-east-1
  e2eControl: false
